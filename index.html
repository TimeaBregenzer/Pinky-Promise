<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Für dich ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f5ede6;
      --paper: #fcf9f5;
      --paper2: #f1e5dd;
      --pink: #d2a5a6;
      --pink-dark: #b98487;
      --ink: #4e403b;
      --muted: #806f68;
      --shadow: rgba(65, 43, 37, .17);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(
          circle at 15% 8%,
          rgba(238, 202, 198, .65),
          transparent 30%
        ),
        radial-gradient(
          circle at 88% 30%,
          rgba(225, 194, 188, .5),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #e9dcd5,
          #f7eee8 48%,
          #eadbd4
        );
      overflow-x: hidden;
    }

    /* Aquarelltextur */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -10;
      pointer-events: none;
      background-image: url("watercolor.png");
      background-size: cover;
      background-position: center;
      opacity: .18;
      mix-blend-mode: multiply;
    }

    /* weicher fotografischer Rand */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 45%,
          rgba(65, 43, 37, .07)
        );
    }

    /* =====================================================
       ALLGEMEIN
    ===================================================== */

    .hand {
      font-family: "Caveat", cursive;
    }

    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      position: relative;
      min-height: 900px;
      padding: 80px 30px 130px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hero-light {
      position: absolute;
      width: 1000px;
      height: 700px;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(
          ellipse,
          rgba(255, 248, 241, .9),
          rgba(236, 205, 201, .5) 45%,
          transparent 72%
        );
      filter: blur(30px);
      z-index: -1;
    }

    /* =====================================================
       HAUPTPAPIER
    ===================================================== */

    .hero-paper {
      position: relative;
      width: min(850px, 70vw);
      min-height: 600px;

      padding: 90px 60px 70px;

      background:
        linear-gradient(
          rgba(255,255,255,.25),
          rgba(255,255,255,.1)
        ),
        url("watercolor.png");

      background-size: cover;
      background-position: center;

      box-shadow:
        0 35px 75px rgba(63, 42, 36, .18),
        inset 0 0 50px rgba(95, 66, 58, .05);

      transform: rotate(-.7deg);

      clip-path: polygon(
        1% 2%,
        18% 1%,
        36% 3%,
        55% 0,
        77% 2%,
        98% 0,
        100% 21%,
        98% 43%,
        100% 67%,
        98% 97%,
        80% 99%,
        62% 97%,
        45% 100%,
        26% 98%,
        8% 100%,
        0 97%,
        1% 76%,
        0 52%,
        1% 30%
      );

      text-align: center;
      z-index: 3;
    }

    .hero-paper::after {
      content: "";
      position: absolute;
      inset: 15px;
      border: 1px solid rgba(87, 61, 54, .07);
      pointer-events: none;
    }

    /* =====================================================
       TITEL
    ===================================================== */

    .title {
      margin: 0;

      font-family: "Caveat", cursive;
      font-size: clamp(82px, 9vw, 145px);
      font-weight: 500;
      line-height: .68;
      letter-spacing: -4px;

      transform: rotate(-3deg);
    }

    .title span {
      display: block;
    }

    .heart {
      position: absolute;
      top: 140px;
      right: 17%;

      color: var(--pink);
      font-family: "Caveat", cursive;
      font-size: 58px;

      transform: rotate(12deg);
    }

    .intro {
      margin: 60px auto 25px;
      max-width: 450px;

      font-size: 10px;
      line-height: 2.1;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .ornament {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;

      color: var(--pink);
      font-size: 21px;
    }

    .ornament::before,
    .ornament::after {
      content: "";
      width: 115px;
      height: 1px;
      background: rgba(80, 59, 53, .2);
    }

    /* =====================================================
       BLUMEN
       Hinter den Polaroids!
    ===================================================== */

    .flowers {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      opacity: .9;

      filter:
        drop-shadow(
          3px 7px 8px rgba(58, 38, 33, .08)
        );
    }

    .flowers img {
      display: block;
      width: 100%;
      height: auto;
    }

    .flowers-left {
      width: 370px;
      left: -100px;
      bottom: 20px;
      transform: rotate(-12deg);
    }

    .flowers-right {
      width: 390px;
      right: -110px;
      top: 10px;
      transform: rotate(8deg);
    }

    /* =====================================================
       SPOTIFY
    ===================================================== */

    .spotify {
      position: relative;
      z-index: 15;

      width: min(620px, 92%);
      margin: 40px auto 0;

      padding: 10px;

      background: rgba(250, 244, 238, .8);

      box-shadow:
        0 15px 32px rgba(58, 38, 33, .13);

      transform: rotate(.4deg);
    }

    .spotify iframe {
      display: block;

      width: 100%;
      height: 152px;

      border: 0;
      border-radius: 12px;
    }

    /* =====================================================
       POLAROIDS
    ===================================================== */

    .polaroid {
      position: absolute;

      background: #fffdf9;

      padding: 10px 10px 43px;

      box-shadow:
        0 20px 35px rgba(54, 37, 32, .2),
        0 3px 8px rgba(54, 37, 32, .1);

      z-index: 8;

      transition:
        transform .35s ease,
        box-shadow .35s ease;
    }

    .polaroid img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .polaroid:hover {
      z-index: 50;

      transform:
        translateY(-12px)
        rotate(0deg)
        scale(1.04) !important;

      box-shadow:
        0 30px 50px rgba(54, 37, 32, .25);
    }

    .tape {
      position: absolute;

      top: -13px;
      left: 50%;

      width: 72px;
      height: 24px;

      transform:
        translateX(-50%)
        rotate(-3deg);

      background: rgba(224, 188, 173, .57);

      box-shadow:
        0 1px 3px rgba(60, 38, 31, .08);
    }

    /* 1 */
    .p1 {
      width: 205px;
      height: 260px;

      left: 3%;
      top: 180px;

      transform: rotate(-9deg);
    }

    /* 2 */
    .p2 {
      width: 195px;
      height: 250px;

      left: 14%;
      bottom: 55px;

      transform: rotate(7deg);
    }

    /* 3 */
    .p3 {
      width: 205px;
      height: 260px;

      right: 14%;
      top: 90px;

      transform: rotate(8deg);
    }

    /* 4 */
    .p4 {
      width: 210px;
      height: 265px;

      right: 3%;
      top: 290px;

      transform: rotate(-8deg);
    }

    /* =====================================================
       POST-IT
    ===================================================== */

    .postit {
      position: absolute;

      right: 8%;
      bottom: 75px;

      z-index: 14;

      width: 165px;
      min-height: 135px;

      padding: 25px 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.16),
          transparent
        ),
        #e6c5c4;

      box-shadow:
        9px 17px 26px rgba(55, 37, 32, .16);

      font-family: "Caveat", cursive;
      font-size: 25px;
      line-height: 1.05;

      transform: rotate(6deg);
    }

    .postit::before {
      content: "";

      position: absolute;

      top: -11px;
      left: 34px;

      width: 75px;
      height: 23px;

      background: rgba(224, 188, 173, .55);

      transform: rotate(-4deg);
    }

    /* =====================================================
       DOODLES
    ===================================================== */

    .doodle {
      position: absolute;

      font-family: "Caveat", cursive;
      color: var(--pink);

      pointer-events: none;
      z-index: 20;
    }

    .doodle-heart {
      font-size: 45px;
      transform: rotate(-12deg);
    }

    .doodle-star {
      font-size: 25px;
      transform: rotate(15deg);
    }

    .doodle-arrow {
      font-size: 45px;
      transform: rotate(-15deg);
    }

    .d1 {
      left: 8%;
      top: 100px;
    }

    .d2 {
      right: 10%;
      bottom: 170px;
    }

    /* =====================================================
       NEUE SEITE / MOODBOARD
    ===================================================== */

    .memories-section {
      position: relative;

      padding: 120px 6vw 150px;

      background:
        linear-gradient(
          rgba(255,255,255,.34),
          rgba(255,255,255,.34)
        ),
        url("watercolor.png");

      background-size: cover;
      background-position: center;
    }

    .paper-edge {
      position: absolute;

      top: -35px;
      left: 0;

      width: 100%;
      height: 75px;

      background: var(--cream);

      clip-path: polygon(
        0 38%,
        8% 22%,
        16% 39%,
        25% 17%,
        35% 40%,
        44% 20%,
        54% 37%,
        64% 15%,
        75% 36%,
        85% 19%,
        94% 38%,
        100% 22%,
        100% 100%,
        0 100%
      );
    }

    .section-title {
      text-align: center;
      margin-bottom: 85px;
    }

    .section-title h2 {
      margin: 0;

      font-family: "Caveat", cursive;
      font-size: 60px;
      font-weight: 500;

      transform: rotate(-2deg);
    }

    .section-title p {
      margin-top: 8px;

      font-size: 9px;
      letter-spacing: .27em;
      text-transform: uppercase;

      color: var(--muted);
    }

    /* =====================================================
       11 FOTOS
    ===================================================== */

    .photo-wall {
      position: relative;

      width: min(1150px, 100%);
      min-height: 2050px;

      margin: auto;
    }

    .wall-photo {
      position: absolute;

      padding: 11px 11px 45px;

      background: #fffdfa;

      box-shadow:
        0 20px 38px rgba(58, 39, 34, .18),
        0 2px 6px rgba(58, 39, 34, .1);

      transition:
        transform .35s ease,
        z-index .1s;
    }

    .wall-photo img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .wall-photo:hover {
      z-index: 50 !important;

      transform:
        translateY(-12px)
        rotate(0deg)
        scale(1.05) !important;
    }

    /* Tape */
    .wall-photo::before {
      content: "";

      position: absolute;

      width: 72px;
      height: 23px;

      top: -12px;
      left: 50%;

      transform:
        translateX(-50%)
        rotate(-3deg);

      background: rgba(224, 188, 173, .55);

      z-index: 5;
    }

    /* FOTO 1 */
    .w1 {
      width: 260px;
      height: 320px;

      left: 4%;
      top: 40px;

      transform: rotate(-7deg);
      z-index: 5;
    }

    /* FOTO 2 */
    .w2 {
      width: 230px;
      height: 290px;

      left: 31%;
      top: 5px;

      transform: rotate(5deg);
      z-index: 7;
    }

    /* FOTO 3 */
    .w3 {
      width: 255px;
      height: 315px;

      right: 4%;
      top: 90px;

      transform: rotate(8deg);
      z-index: 6;
    }

    /* FOTO 4 */
    .w4 {
      width: 235px;
      height: 295px;

      left: 13%;
      top: 410px;

      transform: rotate(8deg);
      z-index: 8;
    }

    /* FOTO 5 */
    .w5 {
      width: 250px;
      height: 310px;

      right: 28%;
      top: 470px;

      transform: rotate(-6deg);
      z-index: 10;
    }

    /* FOTO 6 */
    .w6 {
      width: 245px;
      height: 305px;

      right: 2%;
      top: 450px;

      transform: rotate(-9deg);
      z-index: 7;
    }

    /* FOTO 7 */
    .w7 {
      width: 270px;
      height: 330px;

      left: 1%;
      top: 800px;

      transform: rotate(-5deg);
      z-index: 8;
    }

    /* FOTO 8 */
    .w8 {
      width: 235px;
      height: 295px;

      left: 34%;
      top: 850px;

      transform: rotate(7deg);
      z-index: 10;
    }

    /* FOTO 9 */
    .w9 {
      width: 255px;
      height: 315px;

      right: 5%;
      top: 790px;

      transform: rotate(-6deg);
      z-index: 8;
    }

    /* FOTO 10 */
    .w10 {
      width: 245px;
      height: 305px;

      left: 17%;
      top: 1200px;

      transform: rotate(8deg);
      z-index: 9;
    }

    /* FOTO 11 */
    .w11 {
      width: 270px;
      height: 330px;

      right: 20%;
      top: 1280px;

      transform: rotate(-7deg);
      z-index: 10;
    }

    /* =====================================================
       PAPIERZETTEL ZWISCHEN FOTOS
    ===================================================== */

    .paper-note {
      position: absolute;

      z-index: 20;

      width: 190px;
      min-height: 130px;

      padding: 25px;

      background: #efe0d4;

      box-shadow:
        8px 15px 24px rgba(60, 40, 34, .13);

      font-family: "Caveat", cursive;
      font-size: 27px;
      line-height: 1.05;

      text-align: center;
    }

    .paper-note::before {
      content: "";

      position: absolute;

      width: 65px;
      height: 21px;

      top: -11px;
      left: 50%;

      transform:
        translateX(-50%)
        rotate(-4deg);

      background: rgba(224, 188, 173, .53);
    }

    .note1 {
      left: 49%;
      top: 280px;

      transform: rotate(-5deg);
    }

    .note2 {
      right: 32%;
      top: 730px;

      transform: rotate(5deg);
    }

    .note3 {
      left: 40%;
      top: 1080px;

      transform: rotate(-4deg);
    }

    /* =====================================================
       BLUMEN AUF DER MEMORY-SEITE
    ===================================================== */

    .wall-flowers {
      position: absolute;

      width: 320px;

      opacity: .6;

      pointer-events: none;

      z-index: 2;
    }

    .wall-flowers img {
      width: 100%;
      display: block;
    }

    .wf1 {
      left: -80px;
      top: 520px;
      transform: rotate(-15deg);
    }

    .wf2 {
      right: -90px;
      top: 1120px;
      transform: rotate(10deg);
    }

    .wf3 {
      left: -80px;
      top: 1550px;
      transform: rotate(-8deg);
    }

    /* =====================================================
       FOOTER
    ===================================================== */

    footer {
      padding: 80px 20px 110px;

      text-align: center;

      background: #eadcd5;
    }

    footer .hand {
      font-size: 37px;
    }

    footer p {
      margin-top: 8px;

      font-size: 9px;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 850px) {

      .hero {
        min-height: 780px;
        padding: 45px 12px 90px;
      }

      .hero-paper {
        width: 94%;
        min-height: 590px;
        padding: 80px 20px 45px;
      }

      .title {
        font-size: clamp(75px, 18vw, 105px);
      }

      .intro {
        max-width: 275px;
        margin-top: 55px;

        font-size: 9px;
        letter-spacing: .2em;
      }

      .ornament::before,
      .ornament::after {
        width: 48px;
      }

      /* Blumen bleiben hinten */

      .flowers-left {
        width: 230px;
        left: -95px;
        bottom: 20px;
      }

      .flowers-right {
        width: 240px;
        right: -100px;
        top: 0;
      }

      .p1 {
        width: 125px;
        height: 160px;

        left: -4px;
        top: 125px;
      }

      .p2 {
        width: 125px;
        height: 160px;

        left: 38px;
        bottom: 12px;
      }

      .p3 {
        width: 125px;
        height: 160px;

        right: 28px;
        top: 120px;
      }

      .p4 {
        width: 125px;
        height: 160px;

        right: -5px;
        top: 215px;
      }

      .postit {
        width: 112px;
        min-height: 100px;

        right: 28px;
        bottom: 170px;

        font-size: 20px;
      }

      .spotify {
        width: 90%;
        margin-top: 35px;
      }

      .spotify iframe {
        height: 152px;
      }

      /* ==================================================
         MOBILE FOTO WALL
      ================================================== */

      .memories-section {
        padding: 80px 12px 100px;
      }

      .section-title {
        margin-bottom: 50px;
      }

      .section-title h2 {
        font-size: 52px;
      }

      .photo-wall {
        min-height: 2800px;
        width: 100%;
      }

      .wall-photo {
        width: 155px;
        height: 195px;
        padding: 7px 7px 30px;
      }

      .wall-photo::before {
        width: 50px;
        height: 17px;

      }

      .w1 {
        left: 4%;

        transform: rotate(-7deg);
      }

      .w2 {
        left: auto;
        right: 4%;
        top: 65px;
        transform: rotate(6deg);
      }

      .w3 {
        right: 12%;
        top: 300px;
        transform: rotate(8deg);
      }

      .w4 {
        left: 5%;
        top: 390px;
        transform: rotate(7deg);
      }

      .w5 {
        right: 5%;
        top: 650px;
        transform: rotate(-6deg);
      }

      .w6 {
        left: 4%;
        top: 730px;
        transform: rotate(-8deg);
      }

      .w7 {
        right: 10%;
        top: 970px;
        transform: rotate(-5deg);
      }

      .w8 {
        left: 3%;
        top: 1100px;
        transform: rotate(7deg);
      }

      .w9 {
        right: 5%;
        top: 1350px;
        transform: rotate(-6deg);
      }

      .w10 {
        left: 5%;
        top: 1490px;
        transform: rotate(8deg);
      }

      .w11 {
        right: 9%;
        top: 1730px;
        transform: rotate(-7deg);
      }

      .paper-note {
        width: 135px;
        min-height: 100px;

        padding: 20px;

        font-size: 21px;
      }

      .note1 {
        left: 30%;
        top: 525px;
      }

      .note2 {
        left: 10%;
        top: 870px;
      }

      .note3 {
        right: 12%;

        left: auto;
      }

      .wall-flowers {
        width: 220px;
      }

      .wf1 {
        left: -90px;
        top: 560px;
      }

      .wf2 {
        right: -95px;
        top: 1150px;
      }

      .wf3 {
        left: -100px;
        top: 1650px;
      }
    }

    @media (max-width: 430px) {

      .hero {
        min-height: 750px;
      }

      .hero-paper {
        min-height: 570px;
      }

      .title {
        font-size: 76px;
      }

      .heart {
        top: 140px;
        right: 7%;
        font-size: 45px;
      }

      .p1,
      .p2,
      .p3,
      .p4 {
        width: 115px;
        height: 150px;
      }

      .photo-wall {
        min-height: 2700px;
      }

      .wall-photo {
        width: 145px;
        height: 185px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       HERO
  ===================================================== -->

  <section class="hero">

    <div class="hero-light"></div>

    <!-- Blumen hinter den Fotos -->
    <div class="flowers flowers-left">
      <img src="flowers.png" alt="">
    </div>

    <div class="flowers flowers-right">
      <img src="flowers.png" alt="">
    </div>


    <!-- Hauptpapier -->

    <div class="hero-paper">

      <h1 class="title">
        <span>Pinky</span>
        <span>Promise</span>
      </h1>

      <div class="heart">♡</div>

      <p class="intro">
        Für all die kleinen Momente,<br>
        in denen du mich vermisst.
      </p>

      <div class="ornament">
        ♡
      </div>


      <!-- =================================================
           DEINE SPOTIFY-PLAYLIST
      ================================================== -->

      <div class="spotify">

        <iframe
          src="https://open.spotify.com/embed/playlist/0MQWfTlAiJbHLrfESSXRgn"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>

      </div>

    </div>


    <!-- =================================================
         HERO POLAROIDS
         1-4
    ================================================== -->

    <div class="polaroid p1">
      <div class="tape"></div>
      <img src="1.jpeg" alt="Foto 1">
    </div>

    <div class="polaroid p2">
      <div class="tape"></div>
      <img src="2.jpeg" alt="Foto 2">
    </div>

    <div class="polaroid p3">
      <div class="tape"></div>
      <img src="3.jpeg" alt="Foto 3">
    </div>

    <div class="polaroid p4">
      <div class="tape"></div>
      <img src="4.jpeg" alt="Foto 4">
    </div>


    <!-- Post-it -->

    <div class="postit">
      Für dich.<br>
      Immer. ♡
    </div>


    <!-- Doodles -->

    <div class="doodle doodle-heart d1">
      ♡
    </div>

    <div class="doodle doodle-star d2">
      ✦
